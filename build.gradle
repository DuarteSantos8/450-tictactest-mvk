plugins {
	id 'java'
	id 'application'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

// Versionsnummer der App (MAJOR.MINOR.PATCH), siehe RELEASE.md.
// Der Release-Tag muss genau "v" + diese Version sein, z.B. v1.0.0
version = '1.0.2'

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0' // StdIn/StdOut-Tests
	testImplementation 'net.jqwik:jqwik:1.10.2' // zusaetzliches Testframework (Property-based Testing)
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
	mainClass = 'ch.bbw.m450.tictactoe.TicTacToeMain'
}

// Ausfuehrbares JAR: Main-Class im Manifest, damit "java -jar tictactest-<version>.jar" funktioniert
jar {
	manifest {
		attributes(
				'Main-Class': application.mainClass.get(),
				'Implementation-Version': project.version)
	}
}

run {
	// forward the terminal's stdin so the HumanPlayer can read keyboard input
	standardInput = System.in
}

test {
	useJUnitPlatform {
		excludeTags 'e2e' // die E2E-Tests laufen im eigenen Task e2eTest
	}
	finalizedBy jacocoTestReport // Report immer nach den Tests erzeugen
}

// End-to-End-Tests: ganzes Spiel ueber main() mit Tastatureingabe/Ausgabe (Tag "e2e").
// ./gradlew e2eTest -> Report unter build/reports/tests/e2eTest
tasks.register('e2eTest', Test) {
	description = 'Runs the end-to-end tests (complete game via stdin/stdout).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'e2e'
	}
	shouldRunAfter test
}

jacoco {
	toolVersion = '0.8.15'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true  // XML: wird von den Workflows ausgelesen
		html.required = true // HTML: menschlich lesbarer Report
	}
}

// Build schlaegt fehl, wenn die Branch-Coverage unter 90 % liegt
jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				counter = 'BRANCH'
				minimum = 0.90
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification, e2eTest

// Mutation Testing: ./gradlew pitest -> Report unter build/reports/pitest
pitest {
	pitestVersion = '1.30.1'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	excludedGroups = ['e2e'] // Mutation Testing nur mit den Unit-Tests
	outputFormats = ['HTML', 'XML']
	mutationThreshold = 90 // Build schlaegt fehl, wenn weniger als 90 % der Mutanten erkannt werden
	timestampedReports = false
}
