name: devcontainer-release

# Push auf main (Dockerfile geaendert) -> Image bauen, in die GHCR pushen und Auto-PR erstellen.
# Pull Request -> Image nur testweise bauen (nicht pushen), damit der Dockerfile geprueft wird.
on:
  push:
    branches: [main]
    # Nur der Dockerfile! Sonst wuerde der Merge vom Auto-PR (aendert devcontainer.json)
    # wieder ein neues Image bauen -> Endlosschleife.
    paths:
      - '.devcontainer/Dockerfile'
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-release.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # fuer den Auto-PR
      packages: write # Image in die GHCR pushen
      pull-requests: write # Auto-PR erstellen
    steps:
      - uses: actions/checkout@v4

      # Auf main wird gepusht, sonst nur gebaut. Image-Name muss klein sein.
      # Version: v1.0.<Nummer vom Workflow-Lauf>, zaehlt also automatisch hoch.
      - name: Modus und Image bestimmen
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/tictactest-devcontainer" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "PUSH=true" >> "$GITHUB_ENV"
            echo "VERSION=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "PUSH=false" >> "$GITHUB_ENV"
            echo "VERSION=test-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen (und auf main pushen)
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          push: ${{ env.PUSH }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

      # Ab hier nur nach einem erfolgreichen Push: neue Version ueberall eintragen
      - name: devcontainer.json und CI-Workflows auf neue Version setzen
        if: env.PUSH == 'true'
        run: |
          sed -i "s#${IMAGE}:[a-z0-9.]*#${IMAGE}:${VERSION}#g" \
            .devcontainer/devcontainer.json .github/workflows/*.yml
          git diff

      # Workflow-Dateien darf das normale GITHUB_TOKEN nicht aendern,
      # darum braucht es hier ein eigenes Token (Secret PAT_TOKEN, Scope "repo" + "workflow").
      - name: Auto-PR erstellen
        if: env.PUSH == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          base: main
          branch: chore/devcontainer-${{ env.VERSION }}
          title: "chore: DevContainer auf ${{ env.VERSION }} aktualisieren"
          commit-message: "chore: DevContainer auf ${{ env.VERSION }} aktualisieren"
          body: |
            Automatisch erstellt nach dem Push von `${{ env.IMAGE }}:${{ env.VERSION }}`.

            Aktualisiert `.devcontainer/devcontainer.json` und alle CI-Workflows auf die neue Version.
            Nach dem Merge (= Freigabe) verwenden alle die neue Version.
