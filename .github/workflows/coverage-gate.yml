name: coverage-gate

# Nur bei Pull Requests (oder manuell): Coverage des Branches gegen main pruefen.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # Steps mit bash statt sh ausfuehren
    container:
      image: ghcr.io/sunriseduarte/450-tictactest-mvk:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      pull-requests: write # fuer den PR-Kommentar (Bonus)
    steps:
      - uses: actions/checkout@v4

      # Coverage des PR-Branches
      - name: Coverage des Branches
        run: |
          ./gradlew test jacocoTestReport
          echo "BRANCH_COV=$(bash scripts/coverage.sh)" >> "$GITHUB_ENV"

      # main-Branch in einen Unterordner holen
      - name: main holen
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # Coverage von main
      - name: Coverage von main
        run: |
          ./gradlew -p main test jacocoTestReport
          echo "MAIN_COV=$(bash scripts/coverage.sh main/build/reports/jacoco/test/jacocoTestReport.xml)" >> "$GITHUB_ENV"

      # Beide Werte vergleichen
      - name: Vergleichen
        run: |
          DIFF=$(awk "BEGIN { printf \"%+.1f\", ${BRANCH_COV} - ${MAIN_COV} }")
          if awk "BEGIN { exit (${BRANCH_COV} >= ${MAIN_COV}) ? 0 : 1 }"; then
            RESULT=PASS
          else
            RESULT=FAIL
          fi
          echo "DIFF=$DIFF" >> "$GITHUB_ENV"
          echo "RESULT=$RESULT" >> "$GITHUB_ENV"
          {
            echo "### Coverage Gate"
            echo ""
            echo "- main: ${MAIN_COV} %"
            echo "- Branch: ${BRANCH_COV} %"
            echo "- Differenz: ${DIFF} Prozentpunkte"
            echo "- Ergebnis: ${RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Bonus: Ergebnis als Kommentar im Pull Request
      - name: Ergebnis als PR-Kommentar
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- coverage-gate -->';
            const lines = [
              marker,
              '**Test Coverage**',
              '',
              `main: ${process.env.MAIN_COV} %`,
              `PR: ${process.env.BRANCH_COV} %`,
              `Änderung: ${process.env.DIFF} Prozentpunkte`,
              '',
              process.env.RESULT === 'PASS'
                ? 'PASS - Coverage Gate bestanden'
                : 'FAIL - Coverage Gate nicht bestanden',
            ];
            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Gate: fehlschlagen, wenn der Branch weniger Coverage hat als main
      - name: Gate durchsetzen
        run: |
          echo "main: ${MAIN_COV} %  |  Branch: ${BRANCH_COV} %  |  ${DIFF} Prozentpunkte  ->  ${RESULT}"
          [ "$RESULT" = "PASS" ] || exit 1
