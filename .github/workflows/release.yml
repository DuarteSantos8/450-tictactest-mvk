name: release

# Ein Release startet NUR, wenn ein Tag wie v1.0.0 gepusht wird.
# Ein normaler Push auf main loest keinen Release aus. Ablauf siehe RELEASE.md.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # Steps mit bash statt sh ausfuehren
    # Java 25 + Gradle-Wrapper kommen aus unserem DevContainer-Image (gleiche Umgebung wie lokal)
    container:
      image: ghcr.io/duartesantos8/tictactest-devcontainer:v1.0.6
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root # im CI als root, damit der Workspace beschreibbar ist
    permissions:
      contents: write # zum Erstellen des GitHub Releases
      packages: read
    steps:
      # 1. Repository auschecken (ganze History, damit wir pruefen koennen, ob der Tag auf main liegt)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Im Container gehoert der Ordner einem anderen Benutzer, darum muss man ihn
      # Git als "sicher" melden, sonst bricht z.B. git merge-base mit "dubious ownership" ab
      - name: Git-Ordner als sicher markieren
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # 2. Java: ist im DevContainer-Image schon installiert, hier nur zur Kontrolle ausgeben
      - name: Java-Version anzeigen
        run: java -version

      # 3. Bedingungen pruefen, bevor irgendetwas veroeffentlicht wird
      - name: Release-Bedingungen pruefen
        run: |
          VERSION=$(./gradlew properties -q | grep '^version:' | cut -d' ' -f2)
          echo "Tag: ${GITHUB_REF_NAME}  |  Version im build.gradle: ${VERSION}"

          # Tag und Version muessen zusammenpassen (v1.0.0 <-> 1.0.0)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zur Version ${VERSION} im build.gradle"
            exit 1
          fi

          # Der Commit vom Tag muss auf main sein (nur freigegebene Aenderungen)
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Der Commit ${GITHUB_SHA} ist nicht auf main"
            exit 1
          fi

          # Abschnitt dieser Version aus dem Changelog holen (bis zur naechsten "## "-Zeile)
          awk -v v="## ${VERSION} - " 'index($0, v) == 1 { found = 1; next } /^## / { found = 0 } found' \
            CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md hat keinen Eintrag fuer ${VERSION}"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "JAR=tictactest-${VERSION}.jar" >> "$GITHUB_ENV"
          echo "FRONTEND=tictactest-frontend-${VERSION}.zip" >> "$GITHUB_ENV"

      # 4. Tests ausfuehren (inkl. Coverage-Verification). Schlaegt ein Test fehl, stoppt der Release hier.
      - name: Tests ausfuehren
        run: ./gradlew check

      # 5. Projekt bauen und ausfuehrbares JAR erzeugen -> build/libs/tictactest-X.Y.Z.jar
      - name: JAR bauen
        run: ./gradlew jar

      # 6. Smoke-Test: das fertige JAR wirklich starten und ein Spiel durchspielen
      #    (Mensch = X spielt 3, 4, 5 und gewinnt gegen den GreedyPlayer)
      - name: JAR testen
        run: |
          printf '3\n4\n5\n' | java -jar "build/libs/${JAR}" | tee smoke.log
          grep -q "the winner is: CROSS" smoke.log

      # 7. Frontend als Archiv: version.txt kommt automatisch aus dem Release,
      #    config.js (URL der Web-Konsole) gehoert zur Umgebung und kommt NICHT ins Archiv.
      #    Im Image gibt es kein zip, darum das jar-Werkzeug aus dem JDK (erzeugt ein normales ZIP).
      - name: Frontend-Archiv erstellen
        run: |
          cp -r frontend build/frontend
          rm build/frontend/config.js
          echo "${VERSION}" > build/frontend/version.txt
          jar --create --no-manifest --file "build/libs/${FRONTEND}" -C build/frontend .

      # 8. Pruefsummen, damit man kontrollieren kann, dass der Download nicht veraendert wurde
      - name: SHA-256-Pruefsummen erstellen
        working-directory: build/libs
        run: |
          sha256sum "${JAR}" > "${JAR}.sha256"
          sha256sum "${FRONTEND}" > "${FRONTEND}.sha256"

      # 9. Text fuer den Release zusammenstellen
      - name: Release-Text erstellen
        run: |
          {
            echo "Release: TicTacTest ${GITHUB_REF_NAME}"
            echo ""
            echo "**Tag:** \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "**Commit:** ${GITHUB_SHA}"
            echo ""
            echo "**Änderungen:**"
            cat changes.md
            echo ""
            echo "**Artefakt:** \`${JAR}\` (starten mit \`java -jar ${JAR}\`, benötigt Java 25)"
            echo ""
            echo "**Frontend:** \`${FRONTEND}\` (statische Webseite, siehe docs/webkonsole.md)"
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # 10. GitHub Release erstellen und JAR + Frontend anhaengen
      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v3
        with:
          name: TicTacTest ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true # Fehler, falls das JAR fehlt
          files: |
            build/libs/${{ env.JAR }}
            build/libs/${{ env.JAR }}.sha256
            build/libs/${{ env.FRONTEND }}
            build/libs/${{ env.FRONTEND }}.sha256

  # Deployment nach dem Release: nur die Teile, die sich seit dem letzten Release geaendert haben.
  # Deployt werden die Assets aus dem Release (die Instanz laedt sie vom GitHub-Release), nichts wird neu gebaut.
  deploy:
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # mit pipefail: schlaegt changes.sh fehl, schlaegt auch der Schritt fehl (trotz tee)
    # nie zwei Deployments gleichzeitig (gleiche Gruppe wie im manuellen deploy.yml)
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # Learner-Lab-Credentials (laufen nach jeder Session ab, siehe docs/deployment.md)
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      # nicht geheim, kommen aus "tofu output" und stehen als GitHub Variables
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      # ganze History mit Tags, damit wir mit dem vorherigen Release-Tag vergleichen koennen
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Geaenderte Teile seit dem letzten Release ermitteln
        id: changes
        run: scripts/changes.sh "${GITHUB_REF_NAME}" | tee -a "$GITHUB_OUTPUT"

      # Abgelaufene Credentials frueh und mit klarer Meldung erkennen
      - name: AWS-Zugang pruefen
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true'
        run: |
          if ! aws sts get-caller-identity > /dev/null; then
            echo "::error::AWS-Credentials ungueltig oder abgelaufen. Secrets erneuern und das Deployment mit dem Workflow 'deploy' nachholen."
            exit 1
          fi

      - name: Backend deployen
        if: steps.changes.outputs.backend == 'true'
        run: scripts/deploy.sh backend "${GITHUB_REF_NAME#v}"

      - name: Frontend deployen
        if: steps.changes.outputs.frontend == 'true'
        run: scripts/deploy.sh frontend "${GITHUB_REF_NAME#v}"

      - name: Zusammenfassung
        run: |
          echo "Backend deployt: ${{ steps.changes.outputs.backend }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend deployt: ${{ steps.changes.outputs.frontend }}" >> "$GITHUB_STEP_SUMMARY"
