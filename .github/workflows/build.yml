name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sunriseduarte/450-tictactest-mvk:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - run: ./gradlew build -x test

  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sunriseduarte/450-tictactest-mvk:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Tests laufen und JaCoCo erstellt den Coverage-Report
      - run: ./gradlew test jacocoTestReport

      # Den kompletten HTML-Report als Artifact speichern (fuer jeden Branch)
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html
