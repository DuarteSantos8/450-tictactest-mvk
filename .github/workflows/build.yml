name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/duartesantos8/tictactest-devcontainer:v1.0.6
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root # im CI als root, damit der Workspace beschreibbar ist
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - run: ./gradlew build -x test

  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/duartesantos8/tictactest-devcontainer:v1.0.6
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root # im CI als root, damit der Workspace beschreibbar ist
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Tests + JaCoCo-Report + Coverage-Verification (min. 90 % Branch) + Mutation Testing
      - run: ./gradlew check pitest

      # Alle Reports als Artifacts speichern (fuer jeden Commit, auch wenn ein Test fehlschlaegt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/reports/tests/test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitest-report
          path: build/reports/pitest
