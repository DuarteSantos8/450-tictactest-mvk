name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/duartesantos8/tictactest-devcontainer:v1.0.6
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root # im CI als root, damit der Workspace beschreibbar ist
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # Standard-Action fuer Gradle: richtet Gradle ein und cached die Downloads zwischen den Laeufen
      - uses: gradle/actions/setup-gradle@v6

      # nur kompilieren und JAR bauen, die Tests laufen im Job test
      - run: ./gradlew assemble

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*.jar

  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/duartesantos8/tictactest-devcontainer:v1.0.6
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root # im CI als root, damit der Workspace beschreibbar ist
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # Standard-Action fuer Gradle: richtet Gradle ein und cached die Downloads zwischen den Laeufen
      - uses: gradle/actions/setup-gradle@v6

      # Unit-Tests + E2E-Tests + JaCoCo-Report + Coverage-Verification (min. 90 % Branch) + Mutation Testing
      - run: ./gradlew check pitest

      # Alle Reports als Artifacts speichern (fuer jeden Commit, auch wenn ein Test fehlschlaegt)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          # HTML-Reports (Unit-Tests test/, E2E-Tests e2eTest/) und die JUnit-XML-Dateien
          path: |
            build/reports/tests
            build/test-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/reports/jacoco/test # HTML-Report und jacocoTestReport.xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pitest-report
          path: build/reports/pitest
